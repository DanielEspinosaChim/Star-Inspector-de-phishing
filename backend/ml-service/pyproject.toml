[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: carga el modelo BERT real (segundos)",
  "caso(id): ID del caso en el plan de pruebas",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Copia literal del notebook 04: se deja sin reformatear
exclude = ["app/preprocessing.py"]
